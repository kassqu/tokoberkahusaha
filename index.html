<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KassQu - Toko Berkah Usaha</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4338ca">
  <link rel="icon" type="image/png" href="logo.png?v=2" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body { height: 100%; margin: 0; background-color: #3949AB; font-family: 'Segoe UI', sans-serif; overscroll-behavior-y: none; }
    .full-immersive { position: fixed; inset: 0; z-index: 50; background-image: url('bg-login.jpg?v=1'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
    .full-immersive::before { content: ""; position: absolute; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); z-index: -1; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    
    /* Animasi denyut untuk indikator offline */
    .pulse-red { animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    @media print {
      nav, .sidebar, button, .no-print, footer { display: none !important; }
      body { background: white !important; margin: 0 !important; }
      .receipt-container { display: block !important; position: fixed !important; top: 0; left: 0; width: 100% !important; max-width: 58mm !important; box-shadow: none !important; border: none !important; z-index: 9999 !important; }
      @page { margin: 0; size: auto; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const APP_SCRIPT_URL = "URL_APPS_SCRIPT_LO_DI_SINI"; // GANTI DENGAN URL DEPLOYMENT TERBARU
    const LOW_STOCK_THRESHOLD = 5;

    const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
    const Icon = ({ name, className = "" }) => <span className={`material-symbols-outlined ${className}`}>{name}</span>;
    const showAlert = (opt) => window.Swal.fire(opt);

    function App() {
      const [userRole, setUserRole] = useState(null);
      const [loading, setLoading] = useState(true);
      const [products, setProducts] = useState([]);
      const [categories, setCategories] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [balances, setBalances] = useState({ kembalian: 0 });
      const [users, setUsers] = useState([]);
      const [storeConfig, setStoreConfig] = useState({ name: 'Toko Berkah Usaha', logo: 'logo.png' });
      
      // State untuk Offline Queue (Fitur #4)
      const [offlineQueue, setOfflineQueue] = useState([]);

      // --- LOGIKA OFFLINE SYNC ---
      const syncToGoogleSheets = async (action, data) => {
        try {
          const response = await fetch(APP_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, data, timestamp: new Date().toISOString() })
          });
          
          if (!response.ok) throw new Error("Server Error");
          return true;
        } catch (error) {
          console.error("Sync Failed, saving to offline queue...");
          // Simpan ke queue jika gagal (Fitur #4)
          const newQueue = [...offlineQueue, { action, data, id: Date.now() }];
          setOfflineQueue(newQueue);
          localStorage.setItem('kassqu_offline_queue', JSON.stringify(newQueue));
          return false;
        }
      };

      const processOfflineQueue = async () => {
        if (offlineQueue.length === 0) return;
        
        const queue = [...offlineQueue];
        const item = queue[0];
        
        const success = await syncToGoogleSheets(item.action, item.data);
        if (success) {
          const updatedQueue = queue.slice(1);
          setOfflineQueue(updatedQueue);
          localStorage.setItem('kassqu_offline_queue', JSON.stringify(updatedQueue));
        }
      };

      // Cek queue tiap 30 detik
      useEffect(() => {
        const interval = setInterval(processOfflineQueue, 30000);
        return () => clearInterval(interval);
      }, [offlineQueue]);

      useEffect(() => {
        const savedRole = localStorage.getItem('kassqu_role');
        if (savedRole) setUserRole(savedRole);
        
        const savedQueue = localStorage.getItem('kassqu_offline_queue');
        if (savedQueue) setOfflineQueue(JSON.parse(savedQueue));

        const loadData = async () => {
          try {
            const res = await fetch(APP_SCRIPT_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'GET_INITIAL_DATA' })
            });
            const result = await res.json();
            if (result.status === 'success') {
              setProducts(result.data.products || []);
              setCategories(result.data.categories || []);
              setTransactions(result.data.transactions || []);
              if (result.data.balances) setBalances(result.data.balances);
              if (result.data.storeConfig) setStoreConfig(result.data.storeConfig);
              if (result.data.users) setUsers(result.data.users);
            }
          } catch (e) { console.error("Initial Load Failed"); }
          finally { setLoading(false); }
        };
        loadData();
      }, []);

      if (loading) return (
        <div className="full-immersive flex-col text-white">
          <div className="w-16 h-16 border-4 border-indigo-500 border-t-white rounded-full animate-spin mb-6"></div>
          <h1 className="text-4xl font-black tracking-widest">KASSQU</h1>
        </div>
      );
      
      if (!userRole) return <LoginScreen onLogin={(role) => { setUserRole(role); localStorage.setItem('kassqu_role', role); }} storeConfig={storeConfig} users={users} />;

      return (
        <div className="min-h-screen bg-slate-50">
          {/* Label Offline (Fitur #4) */}
          {offlineQueue.length > 0 && (
            <div className="fixed top-0 left-0 right-0 bg-orange-500 text-white text-[10px] py-1 text-center font-bold z-[100] pulse-red">
              Mode Offline: {offlineQueue.length} Transaksi tertunda (Menunggu Internet...)
            </div>
          )}

          {userRole === 'kasir' ? (
            <KasirDashboard 
              products={products} categories={categories} storeConfig={storeConfig}
              onLogout={() => { setUserRole(null); localStorage.removeItem('kassqu_role'); }}
              onTransactionSuccess={(trx) => {
                setTransactions(prev => [trx, ...prev]);
                syncToGoogleSheets('ADD_TRANSACTION', trx);
                // Update stok lokal agar alert stok langsung berubah (Fitur #2)
                setProducts(prev => prev.map(p => {
                  const itemInCart = trx.items.find(it => it.id === p.id);
                  return itemInCart ? { ...p, stock: p.stock - itemInCart.qty } : p;
                }));
              }}
            />
          ) : (
            <AdminDashboard 
              products={products} setProducts={setProducts} 
              categories={categories} setCategories={setCategories}
              transactions={transactions} storeConfig={storeConfig} setStoreConfig={setStoreConfig}
              balances={balances} setBalances={setBalances}
              users={users} setUsers={setUsers}
              onLogout={() => { setUserRole(null); localStorage.removeItem('kassqu_role'); }} 
              syncToSheets={syncToGoogleSheets}
            />
          )}
        </div>
      );
    }

    // --- DASHBOARD KASIR ---
    function KasirDashboard({ products, categories, storeConfig, onLogout, onTransactionSuccess }) {
      const [cart, setCart] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeCategory, setActiveCategory] = useState('Semua');
      const [showPayment, setShowPayment] = useState(false);
      const [lastInvoice, setLastInvoice] = useState(null);
      const [showScanner, setShowScanner] = useState(false);

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchCat = activeCategory === 'Semua' || p.category === activeCategory;
          const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.barcode === searchQuery;
          return matchCat && matchSearch;
        });
      }, [products, activeCategory, searchQuery]);

      const addToCart = (product) => {
        if (product.stock <= 0) return showAlert({ icon: 'error', title: 'Habis', text: 'Stok barang kosong!' });
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing && existing.qty >= product.stock) {
            showAlert({ icon: 'warning', title: 'Batas', text: 'Maksimal stok tercapai.' });
            return prev;
          }
          if (existing) return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const playBeep = (isSuccess) => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          if (isSuccess) { osc.frequency.setValueAtTime(1000, ctx.currentTime); osc.start(); osc.stop(ctx.currentTime + 0.1); }
          else { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, ctx.currentTime); osc.start(); osc.stop(ctx.currentTime + 0.4); }
        } catch (e) {}
      };

      return (
        <div className="flex h-screen overflow-hidden bg-slate-100">
          <div className="flex-1 flex flex-col h-full overflow-hidden no-print">
            {/* Header Kasir */}
            <div className="bg-indigo-700 text-white p-4 shadow-md z-10">
              <div className="flex items-center justify-between mb-4">
                <h2 className="text-xl font-black">{storeConfig.name}</h2>
                <button onClick={onLogout} className="bg-white/10 p-2 rounded-full"><Icon name="power_settings_new" /></button>
              </div>
              <form onSubmit={(e) => { e.preventDefault(); const f = products.find(p => p.barcode === searchQuery); if(f){ playBeep(true); addToCart(f); setSearchQuery(''); } else { playBeep(false); } }} className="relative">
                <input type="text" placeholder="Cari atau scan barcode..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-10 pr-4 py-3 rounded-2xl text-slate-800 outline-none" />
                <Icon name="search" className="absolute left-3 top-3.5 text-slate-400" />
                <button type="button" onClick={() => setShowScanner(true)} className="absolute right-3 top-2.5 text-indigo-500 bg-indigo-50 p-1.5 rounded-lg"><Icon name="qr_code_scanner" /></button>
              </form>
            </div>

            {/* Produk Grid */}
            <div className="flex-1 overflow-y-auto p-4">
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {filteredProducts.map(p => (
                  <div key={p.id} onClick={() => addToCart(p)} className="bg-white rounded-2xl p-3 shadow-sm border relative cursor-pointer active:scale-95 transition-all">
                    {/* FITUR #2: LOW STOCK ALERT BADGE */}
                    {p.stock > 0 && p.stock <= LOW_STOCK_THRESHOLD && (
                      <div className="absolute top-2 left-2 bg-red-500 text-white text-[9px] px-1.5 py-0.5 rounded-md font-bold z-10 animate-bounce">
                        STOK MENIPIS
                      </div>
                    )}
                    {p.stock <= 0 && <div className="absolute inset-0 bg-white/60 flex items-center justify-center font-black text-red-600 z-20">HABIS</div>}
                    
                    <img src={p.image || 'https://via.placeholder.com/150'} className="w-full aspect-square object-cover rounded-xl mb-2" />
                    <h4 className="font-bold text-xs truncate">{p.name}</h4>
                    <div className="flex justify-between items-center mt-1">
                      <span className="text-indigo-600 font-black text-xs">{formatRp(p.price)}</span>
                      {/* FITUR #2: WARNA STOK BERUBAH MERAH JIKA LIMIT */}
                      <span className={`text-[10px] font-bold ${p.stock <= LOW_STOCK_THRESHOLD ? 'text-red-500' : 'text-slate-400'}`}>
                        Sisa: {p.stock}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Area Keranjang & Pembayaran (Sama seperti kode sebelumnya tapi sudah optimize) */}
          <div className="w-96 bg-white border-l shadow-2xl flex flex-col no-print">
             <div className="p-4 border-b font-black text-xl flex items-center gap-2"><Icon name="shopping_cart" /> Pesanan</div>
             <div className="flex-1 overflow-y-auto p-4 space-y-3">
               {cart.map(item => (
                 <div key={item.id} className="flex justify-between items-center bg-slate-50 p-2 rounded-xl">
                   <div className="w-2/3">
                     <p className="font-bold text-xs truncate">{item.name}</p>
                     <p className="text-[10px] text-indigo-600">{formatRp(item.price)} x {item.qty}</p>
                   </div>
                   <div className="flex items-center gap-2">
                     <button onClick={() => setCart(cart.filter(c => c.id !== item.id))} className="text-red-500"><Icon name="delete" className="text-sm"/></button>
                   </div>
                 </div>
               ))}
             </div>
             <div className="p-4 bg-slate-50 border-t">
                <div className="flex justify-between mb-4"><span className="font-bold">Total</span><span className="text-2xl font-black">{formatRp(cart.reduce((s,i) => s + (i.price*i.qty), 0))}</span></div>
                <button disabled={cart.length === 0} onClick={() => setShowPayment(true)} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black disabled:bg-slate-300">BAYAR SEKARANG</button>
             </div>
          </div>

          {/* Modal Scanner Kamera HP */}
          {showScanner && (
            <div className="fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-6">
              <div className="bg-white rounded-3xl w-full max-w-sm p-4 relative">
                <button onClick={() => setShowScanner(false)} className="absolute -top-12 right-0 text-white"><Icon name="close" className="text-4xl"/></button>
                <div id="reader" className="w-full rounded-2xl overflow-hidden"></div>
                <p className="text-center text-xs mt-4 text-slate-500">Arahkan kamera ke Barcode</p>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- LOGIN SCREEN ---
    function LoginScreen({ onLogin, storeConfig, users }) {
       const [pin, setPin] = useState('');
       return (
         <div className="full-immersive">
           <div className="bg-white/95 p-8 rounded-[2.5rem] w-full max-w-sm text-center shadow-2xl">
             <div className="bg-indigo-600 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-4 text-white shadow-lg"><Icon name="point_of_sale" className="text-4xl" /></div>
             <h1 className="text-3xl font-black text-slate-800 mb-6">{storeConfig.name}</h1>
             <input type="password" value={pin} onChange={(e) => setPin(e.target.value)} placeholder="Masukkan PIN" className="w-full p-4 bg-slate-100 rounded-2xl text-center text-2xl font-mono mb-4 outline-none border-2 focus:border-indigo-500" />
             <button onClick={() => { 
               const u = users.find(x => x.pin === pin); 
               if(u) onLogin(u.kode); else showAlert({ icon: 'error', title: 'PIN Salah!' });
             }} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-lg">MASUK</button>
           </div>
         </div>
       );
    }

    // ==========================================
    // 3. DASHBOARD ADMIN
    // ==========================================
    function AdminDashboard({ products, setProducts, categories, setCategories, transactions, storeConfig, setStoreConfig, balances, setBalances, users, setUsers, onLogout, syncToSheets }) {
      const [activeTab, setActiveTab] = useState('products');

      const tabs = [
        { id: 'report', label: 'Laporan', icon: 'monitoring' },
        { id: 'products', label: 'Produk', icon: 'inventory_2' },
        { id: 'balances', label: 'Kas', icon: 'payments' },
        { id: 'users', label: 'Pegawai', icon: 'group' },
        { id: 'settings', label: 'Toko', icon: 'settings' }
      ];

      return (
        <div className="flex flex-col md:flex-row h-[100dvh] w-full max-w-[100vw] bg-slate-50 overflow-hidden">
          
          <aside className="w-full md:w-72 bg-slate-900 text-white pt-[env(safe-area-inset-top,1rem)] flex flex-col shrink-0 z-20 shadow-md">
            <div className="p-4 md:p-6 border-b border-slate-800 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                {storeConfig?.logo ? (
                  <img src={storeConfig.logo} alt="Logo" className="w-8 h-8 object-contain bg-white rounded-md p-1 shrink-0" />
                ) : (
                  <div className="bg-indigo-600 w-8 h-8 rounded-lg flex items-center justify-center shrink-0">
                    <Icon name="point_of_sale" className="text-white text-sm" />
                  </div>
                )}
                <h2 className="text-lg md:text-xl font-black text-white">Admin {storeConfig?.name || 'KasQu'}</h2>
              </div>
              <button onClick={onLogout} className="md:hidden bg-red-500/20 text-red-500 hover:bg-red-500 hover:text-white p-2 rounded-xl transition-all" title="Keluar">
                <Icon name="logout" className="text-[20px]" />
              </button>
            </div>

            <nav className="flex p-2 md:p-4 gap-1 md:space-y-2 overflow-x-auto md:overflow-y-auto flex-row md:flex-col hide-scrollbar bg-slate-900 border-b border-slate-800 md:border-none">
              {tabs.map(t => (
                <button key={t.id} onClick={() => setActiveTab(t.id)} 
                  className={`flex items-center justify-center md:justify-start gap-2 px-4 py-3 rounded-xl transition-all whitespace-nowrap flex-1 md:flex-none ${activeTab === t.id ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                  <Icon name={t.icon} className="text-xl md:text-[18px]" /> 
                  <span className="font-bold text-sm hidden md:inline">{t.label}</span>
                </button>
              ))}
            </nav>

            <div className="hidden md:block p-4 border-t border-slate-800 mt-auto">
              <button onClick={onLogout} className="w-full flex items-center justify-center gap-2 px-4 py-3 bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white rounded-xl transition-all font-bold">
                <Icon name="logout" /> Keluar
              </button>
            </div>
          </aside>

          <main className="flex-1 overflow-y-auto overflow-x-hidden p-4 md:p-8 w-full">
            {activeTab === 'report' && <AdminReport transactions={transactions} storeConfig={storeConfig} />}
            {activeTab === 'products' && <AdminProducts products={products} setProducts={setProducts} categories={categories} setCategories={setCategories} syncToSheets={syncToSheets} />}
            {activeTab === 'balances' && <AdminBalances balances={balances} setBalances={setBalances} syncToSheets={syncToSheets} />}
            {activeTab === 'users' && <AdminUsers users={users} setUsers={setUsers} syncToSheets={syncToSheets} />}
            {activeTab === 'settings' && <AdminSettings storeConfig={storeConfig} setStoreConfig={setStoreConfig} syncToSheets={syncToSheets} />}
          </main>
        </div>
      );
    }

    // --- KOMPONEN PIE CHART ---
    function PieChart({ data, labels, title, colors, isCurrency = false }) {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }
        
        if (!chartRef.current) return;

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{
              data: data,
              backgroundColor: colors || ['#4f46e5', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#64748b'],
              borderWidth: 0,
              hoverOffset: 4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'right', labels: { boxWidth: 12, usePointStyle: true, font: { size: 11 } } },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    let label = context.label || '';
                    if (label) { label += ': '; }
                    if (context.parsed !== null) {
                      label += isCurrency ? new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(context.parsed) : context.parsed + ' item';
                    }
                    return label;
                  }
                }
              }
            },
            cutout: '65%'
          }
        });
        
        return () => {
          if (chartInstance.current) chartInstance.current.destroy();
        };
      }, [data, labels, title, colors, isCurrency]);

      if (!data || data.length === 0) {
        return <div className="h-[200px] flex items-center justify-center text-slate-400 text-sm italic">Belum ada data</div>;
      }

      return (
        <div className="flex flex-col h-full">
          <h3 className="font-bold text-slate-700 mb-4 text-sm">{title}</h3>
          <div className="relative flex-1 min-h-[200px]">
            <canvas ref={chartRef}></canvas>
          </div>
        </div>
      );
    }

    // --- KOMPONEN LAPORAN ---
    function AdminReport({ transactions, storeConfig }) {
        const [filter, setFilter] = useState('today');
        const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
        const [endDate, setEndDate] = useState(new Date().toISOString().split('T')[0]);
        
        const filteredTransactions = useMemo(() => {
        const now = new Date();
        return transactions.filter(trx => {
          const d = new Date(trx.date);
          if (filter === 'today') return d.toDateString() === now.toDateString();
          if (filter === 'week') {
            const startOfWeek = new Date();
            startOfWeek.setDate(now.getDate() - now.getDay());
            startOfWeek.setHours(0, 0, 0, 0);
            return d >= startOfWeek;
          }
          if (filter === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
          if (filter === 'custom') {
            const start = new Date(startDate);
            const end = new Date(endDate);
            start.setHours(0, 0, 0, 0);
            end.setHours(23, 59, 59, 999);
            return d >= start && d <= end;
          }
          return true;
        });
      }, [transactions, filter, startDate, endDate]);

      const calcSummary = (trxs) => trxs.reduce((acc, trx) => {
        acc.omzet += trx.total;
        trx.items.forEach(i => {
          acc.modal += (i.modal || 0) * i.qty;
          acc.laba += (i.price - (i.modal || 0)) * i.qty;
        });
        return acc;
      }, { omzet: 0, modal: 0, laba: 0 });

      const summary = calcSummary(filteredTransactions);

      const paymentStats = useMemo(() => {
        const stats = {};
        filteredTransactions.forEach(trx => {
          stats[trx.method] = (stats[trx.method] || 0) + trx.total;
        });
        return {
          labels: Object.keys(stats),
          data: Object.values(stats)
        };
      }, [filteredTransactions]);

      const productStats = useMemo(() => {
        const stats = {};
        filteredTransactions.forEach(trx => {

        setIsModalOpen(true);
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 300; 
            const MAX_HEIGHT = 300; 
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
            setFormData({ ...formData, image: dataUrl });
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

        e.preventDefault();
        const payload = { ...formData, stock: Number(formData.stock), modal: Number(formData.modal), price: Number(formData.price), diskon: Number(formData.diskon || 0) };

          setProducts(products.map(p => p.id === payload.id ? payload : p));

          setProducts([...products, payload]);

             </div>
          </div>

          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
             <h3 className="text-lg font-bold text-slate-800 mb-4">Set Modal Laci / Uang Kembalian</h3>
             <form onSubmit={handleUpdate} className="flex flex-col sm:flex-row gap-4">
                <div className="relative flex-1">
                  <span className="absolute left-4 top-1/2 -translate-y-1/2 font-bold text-slate-400 text-lg">Rp</span>
                  <input 
                    required 
                    type="text" 
                    value={editAmount ? new Intl.NumberFormat('id-ID').format(editAmount.replace(/\D/g, '')) : ''}
                    onChange={(e) => setEditAmount(e.target.value.replace(/\D/g, ''))}
                    placeholder="Contoh: 100.000"
                    className="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-xl outline-none focus:border-indigo-500 transition-all" 
                  />
                </div>
                <button type="submit" className="bg-indigo-600 text-white px-8 py-4 rounded-xl font-bold hover:bg-indigo-700 shadow-md shadow-indigo-200 transition-all whitespace-nowrap">
                  Simpan Saldo
                </button>
             </form>
          </div>
        </div>
      );
    }

    // --- ADMIN USERS (KELOLA PENGGUNA) ---
    function AdminUsers({ users, setUsers, syncToSheets }) {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [formData, setFormData] = useState({});
      const openModal = (u = null) => {
        setFormData(u ? {...u} : { id: `USR-${Date.now()}`, kode: '', nama: '', pin: '', status: 'aktif' });
        setIsModalOpen(true);
      };
      const handleSave = (e) => {
        e.preventDefault();
        const payload = { ...formData };
        if ((users || []).find(u => u.id === payload.id)) {
          setUsers(users.map(u => u.id === payload.id ? payload : u));
          syncToSheets('UPDATE_USER', payload);
        } else {
          setUsers([...(users || []), payload]);
          syncToSheets('ADD_USER', payload);
        }
        setIsModalOpen(false); showAlert({ icon: 'success', title: 'Tersimpan!' });
      };
      const delUser = (id) => {
        setUsers(users.filter(u=>u.id!==id)); syncToSheets('DELETE_USER', {id}); showAlert({ icon: 'success', title: 'Dihapus!' });
      };

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center bg-white p-6 rounded-2xl border border-slate-100">
            <h2 className="text-2xl font-bold">Pegawai & PIN</h2>
            <button 
              onClick={() => openModal()} 
              className="bg-indigo-600 text-white px-3 md:px-6 py-2 rounded-xl font-bold hover:bg-indigo-700 shadow-md shadow-indigo-200 flex items-center gap-2 transition-all active:scale-95"
            >
              <Icon name="person_add" className="text-[18px] md:text-sm" /> 
              <span className="hidden md:inline">Tambah Staff</span>
            </button>          
          </div>
          <div className="bg-white rounded-2xl border border-slate-100 overflow-x-auto shadow-sm hide-scrollbar">
            <table className="w-full text-left text-sm whitespace-nowrap min-w-[500px]">
              <thead className="bg-slate-50 text-slate-400 uppercase text-[10px] font-black tracking-widest">
                <tr><th className="p-4">Peran/Kode</th><th className="p-4">Nama</th><th className="p-4">PIN</th><th className="p-4 text-center">Status</th><th className="p-4 text-center">Aksi</th></tr>
              </thead>
              <tbody className="divide-y divide-slate-50">
                {(users || []).map(u => (
                  <tr key={u.id} className="hover:bg-slate-50">
                    <td className="p-4 font-bold text-indigo-600">{u.kode}</td>
                    <td className="p-4">{u.nama}</td>
                    <td className="p-4 font-mono">{u.pin}</td>
                    <td className="p-4 text-center"><span className={`px-2 py-1 rounded text-[10px] font-bold ${u.status === 'aktif' ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'}`}>{u.status}</span></td>
                    <td className="p-4 text-center space-x-2"><button onClick={()=>openModal(u)} className="p-2 text-indigo-600"><Icon name="edit" /></button><button onClick={()=>delUser(u.id)} className="p-2 text-red-500"><Icon name="delete" /></button></td>
                  </tr>
                ))}
                {!users?.length && <tr><td colSpan="5" className="p-12 text-center text-slate-400 italic">Belum ada pegawai.</td></tr>}
              </tbody>
            </table>
          </div>
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-[2rem] w-full max-w-md shadow-2xl p-8 animate-slide-up">
                <h3 className="text-xl font-bold mb-6">Detail Pegawai</h3>
                <form onSubmit={handleSave} className="space-y-4">
                  <div className="grid grid-cols-2 gap-4">
                    <div><label className="block text-xs font-bold text-slate-400 mb-1">Kode (admin/kasir)</label><input required value={formData.kode} onChange={e=>setFormData({...formData, kode: e.target.value.toLowerCase()})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none" /></div>
                    <div><label className="block text-xs font-bold text-slate-400 mb-1">Nama Staff</label><input required value={formData.nama} onChange={e=>setFormData({...formData, nama: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none" /></div>
                  </div>
                  <div><label className="block text-xs font-bold text-slate-400 mb-1">PIN Rahasia</label><input required value={formData.pin} onChange={e=>setFormData({...formData, pin: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-mono" placeholder="4 Digit" /></div>
                  <div><label className="block text-xs font-bold text-slate-400 mb-1">Status</label><select value={formData.status} onChange={e=>setFormData({...formData, status: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none"><option value="aktif">Aktif</option><option value="nonaktif">Nonaktif</option></select></div>
                  <button type="submit" className="w-full bg-indigo-600 text-white p-4 rounded-2xl font-black text-lg shadow-xl shadow-indigo-100">SIMPAN DATA</button>
                  <button type="button" onClick={()=>setIsModalOpen(false)} className="w-full text-slate-400 mt-2 text-sm">Batal</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- KOMPONEN PENGATURAN ADMIN ---
    function AdminSettings({ storeConfig, setStoreConfig, syncToSheets }) {
      const [form, setForm] = useState(storeConfig);
      
      const save = (e) => { 
        e.preventDefault(); 
        setStoreConfig(form); 
        syncToSheets('UPDATE_SETTINGS', form); 
        showAlert({icon:'success', title:'Tersimpan'}); 
      };

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 200; 
            let width = img.width; let height = img.height;
            if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
            else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, width, height);
            
            ctx.drawImage(img, 0, 0, width, height);
            
            setForm({ ...form, logo: canvas.toDataURL('image/jpeg', 0.6) });
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-xl">
          <h2 className="text-2xl font-bold text-slate-800 mb-6">Pengaturan Toko & Struk</h2>
          <form onSubmit={save} className="space-y-4">
            
            <div className="flex items-center gap-4 mb-6">
              {form.logo ? (
                <div className="relative w-20 h-20 rounded-2xl overflow-hidden border border-slate-200 shrink-0 bg-slate-50 flex items-center justify-center p-2">
                  <img src={form.logo} className="w-full h-full object-contain" alt="Logo Preview" />
                  <button type="button" onClick={() => setForm({...form, logo: ''})} className="absolute inset-0 bg-black/60 text-white flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity rounded-2xl"><Icon name="delete"/></button>
                </div>
              ) : (
                <div className="w-20 h-20 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-center shrink-0 text-slate-400">
                  <Icon name="store" className="text-3xl" />
                </div>
              )}
              <div className="flex-1">
                <label className="block text-sm font-bold text-slate-500 mb-1">Logo Toko (Opsional)</label>
                <input type="file" accept="image/*" onChange={handleLogoUpload} className="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 outline-none cursor-pointer"/>
                <p className="text-[10px] text-slate-400 mt-1">Logo ini akan muncul di bagian atas struk kasir.</p>
              </div>
            </div>

            <div><label className="block text-sm font-bold text-slate-500 mb-1">Nama Toko</label><input required type="text" value={form.name} onChange={e=>setForm({...form, name:e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none"/></div>
            <div><label className="block text-sm font-bold text-slate-500 mb-1">Alamat Lengkap</label><textarea required rows="2" value={form.address} onChange={e=>setForm({...form, address:e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none"/></div>
            <div><label className="block text-sm font-bold text-slate-500 mb-1">Nomor Telepon / WhatsApp</label><input required type="text" value={form.phone} onChange={e=>setForm({...form, phone:e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none"/></div>
            <div><label className="block text-sm font-bold text-slate-500 mb-1">Pesan Footer Struk</label><input required type="text" value={form.footer} onChange={e=>setForm({...form, footer:e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none"/></div>
            <button type="submit" className="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold shadow-lg mt-4">Simpan Perubahan</button>
          </form>
        </div>
      )
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
